name: Build Latest Upstream APK (signed release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      KEYSTORE_PATH: ${{ github.workspace }}/temp.jks

    steps:
      - name: Checkout upstream repo
        uses: actions/checkout@v4
        with:
          repository: MuntashirAkon/AppManager
          ref: master
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK manually
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"

          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          ls -R "$ANDROID_HOME/cmdline-tools"

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew -v

      - name: Build release APK
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Sign release APK using temporary keystore
        shell: bash
        run: |
          set -e
          unsigned_apk=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$unsigned_apk" ]; then
            echo "No APK found in app/build/outputs/"
            find app/build/outputs -maxdepth 6 -type f | head -n 50
            exit 1
          fi

          KS_PASS="temp1234"
          KEY_ALIAS="tempkey"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -alias "$KEY_ALIAS" \
            -dname "CN=Temp User, OU=Temp, O=Temp, L=Temp, S=Temp, C=TR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"

          cp "$unsigned_apk" app-release-signed.apk
          "$BUILD_TOOLS"/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$KS_PASS" \
            --out app-release-signed.apk \
            app-release-signed.apk

          "$BUILD_TOOLS"/apksigner verify --print-certs app-release-signed.apk || true

          ls -lh app-release-signed.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
