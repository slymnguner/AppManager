name: Build Latest Upstream APK (signed release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout upstream repo
        uses: actions/checkout@v4
        with:
          repository: MuntashirAkon/AppManager
          ref: master
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget coreutils bash zip dos2unix

      - name: Install Android commandline tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -o -q cmdline.zip -d $ANDROID_HOME/cmdline-tools

          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv -f "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

      - name: Install Android SDK packages and accept licenses
        env:
          PATH: ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin:${{ env.PATH }}
        shell: bash
        run: |
          bash "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          printf 'y\n' | bash "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew -v

      - name: Build release APK
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Sign release APK using temporary keystore
        shell: bash
        run: |
          set -e
          unsigned_apk=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$unsigned_apk" ]; then
            echo "No APK found in app/build/outputs/"
            find app/build/outputs -maxdepth 6 -type f | head -n 50
            exit 1
          fi

          echo "Found APK: $unsigned_apk"

          KS_PASS="temp1234"
          KEY_ALIAS="tempkey"

          keytool -genkeypair \
            -v \
            -keystore temp.jks \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -alias "$KEY_ALIAS" \
            -dname "CN=Temp User, OU=Temp, O=Temp, L=Temp, S=Temp, C=TR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"

          cp "$unsigned_apk" app-release-signed.apk
          "$BUILD_TOOLS"/apksigner sign \
            --ks temp.jks \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$KS_PASS" \
            --out app-release-signed.apk \
            app-release-signed.apk

          "$BUILD_TOOLS"/apksigner verify --print-certs app-release-signed.apk

          ls -lh app-release-signed.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
