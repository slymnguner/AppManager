name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_release_apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_API: 36
      ANDROID_BUILD_TOOLS: 36.1.0
      JAVA_VERSION: 17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: ${{ env.ANDROID_SDK_API }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p .github/workflows/tmp
          echo "$KEYSTORE_BASE64" | base64 --decode > .github/workflows/tmp/release-keystore.jks

      - name: Locate unsigned APK
        id: locate_apk
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | grep -E "release|unsigned" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs/apk"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Zipalign APK
        run: |
          echo "Aligning APK..."
          "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/zipalign" -v -p 4 "${{ steps.locate_apk.outputs.apk_path }}" app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner" sign \
            --ks .github/workflows/tmp/release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppManager-release.apk
          path: app/build/outputs/apk/release/app-release-signed.apk
